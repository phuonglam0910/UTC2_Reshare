<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý tin đăng | Quản trị UTC2 RESHARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/admin.css">
  <link rel="stylesheet" href="style/posts.css">
</head>
<body data-page="posts" data-title="Quản lý tin đăng">
  <a class="skip-link" href="#content">Bỏ qua điều hướng</a>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Thanh điều hướng"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" id="content" tabindex="-1">
        <div class="toolbar" role="search">
          <input class="field field--search" id="search" type="search" placeholder="Tìm theo tiêu đề tin đăng" aria-label="Tìm kiếm tin đăng theo tiêu đề" autocomplete="off">
          <select class="field" id="filter-type" aria-label="Lọc theo loại tin">
            <option value="all">Tất cả loại tin</option>
            <option value="exchange,gift">Trao đổi / cho tặng</option>
            <option value="lost,found">Thất lạc / nhặt được</option>
            <option value="exchange">Trao đổi đồ cũ</option>
            <option value="gift">Cho tặng đồ cũ</option>
            <option value="lost">Báo mất đồ</option>
            <option value="found">Nhặt được đồ</option>
          </select>
          <select class="field" id="filter-status" aria-label="Lọc theo trạng thái">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chờ duyệt</option>
            <option value="approved">Đã duyệt</option>
            <option value="hidden">Đã ẩn</option>
          </select>
          <button type="button" class="btn btn--ghost" id="reset-filters">Xóa bộ lọc</button>
          <span class="toolbar__count" id="result-count" aria-live="polite"></span>
        </div>

        <div class="table-wrap">
          <table class="table table--posts">
            <thead>
              <tr>
                <th class="col-num">STT</th>
                <th>Mã tin</th>
                <th>Tiêu đề</th>
                <th>Người đăng</th>
                <th>Loại tin</th>
                <th>Ngày đăng</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="posts-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="script/admin.js"></script>
  <script src="script/posts.js"></script>
</body>
</html>
